name: Main evidence and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.1.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Check Go formatting
        shell: bash
        run: |
          # shellcheck disable=SC2016
          set -Eeuo pipefail
          files=$(gofmt -l .)
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            for file in $files; do gofmt -d "$file"; done
            exit 1
          fi

      - name: Check workflow syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.7 -ignore SC2016

      - name: Check shell syntax
        shell: bash
        run: bash -n scripts/*.sh

      - name: Check immutable release policy
        shell: bash
        run: bash scripts/assert-immutable-release-policy.sh

      - name: Measure build and test
        shell: bash
        run: bash scripts/ci-measure.sh "$RUNNER_TEMP/gooo-incremental-conformance-planner-main/measure"

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Run fixed conformance
        shell: bash
        run: bash scripts/conformance.sh "$RUNNER_TEMP/gooo-incremental-conformance-planner" "$RUNNER_TEMP/gooo-incremental-conformance-planner-main/conformance"

      - name: Record inventory
        shell: bash
        run: bash scripts/inventory.sh "$RUNNER_TEMP/gooo-incremental-conformance-planner-main"

      - name: Assert evidence
        shell: bash
        run: bash scripts/assert-evidence.sh "$RUNNER_TEMP/gooo-incremental-conformance-planner-main"

      - name: Assemble evidence
        shell: bash
        run: bash scripts/assemble-evidence.sh "$RUNNER_TEMP/gooo-incremental-conformance-planner-main"

      - name: Build immutable evidence asset
        shell: bash
        run: |
          # shellcheck disable=SC2016
          set -Eeuo pipefail
          asset="$RUNNER_TEMP/gooo-incremental-conformance-planner-${RELEASE_TAG}-evidence.tar.gz"
          tar -czf "$asset" -C "$RUNNER_TEMP/gooo-incremental-conformance-planner-main" .
          digest=$(sha256sum "$asset" | cut -d' ' -f1)
          printf 'asset=%s\ndigest=sha256:%s\n' "$asset" "$digest" > "$RUNNER_TEMP/release-asset.txt"

      - name: Create or recover annotated tag and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          set -Eeuo pipefail
          asset=$(grep '^asset=' "$RUNNER_TEMP/release-asset.txt" | cut -d= -f2-)
          digest=$(grep '^digest=' "$RUNNER_TEMP/release-asset.txt" | cut -d= -f2-)
          asset_name=$(basename "$asset")
          printf '# %s\n\nEvidence asset digest: `%s`\n\nThe release is published only after draft verification.\n' "$RELEASE_TAG" "$digest" > "$RUNNER_TEMP/release-notes.md"
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
            tag_object=$(printf '%s' "$tag_ref" | jq -r '.object.sha')
            tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")
            jq -e --arg sha "$GITHUB_SHA" '.object.sha == $sha and .object.type == "commit"' <<<"$tag_json" >/dev/null
            tag_mode=recovered
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "gooo incremental conformance planner $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
            tag_mode=created
          fi

          release_list=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          release_matches=$(printf '%s' "$release_list" | jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)]')
          release_count=$(printf '%s' "$release_matches" | jq 'length')
          if [[ "$release_count" == 1 ]]; then
            release_id=$(printf '%s' "$release_matches" | jq -r '.[0].id')
            release_mode=recovered
            release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == true and .prerelease == false' <<<"$release_json" >/dev/null
          elif [[ "$release_count" == 0 ]]; then
            release_json=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f name="Gooo incremental conformance planner $RELEASE_TAG" \
              -f body="$(<"$RUNNER_TEMP/release-notes.md")" \
              -F draft=true \
              -F prerelease=false)
            release_id=$(printf '%s' "$release_json" | jq -r '.id')
            test "$release_id" != "null"
            release_mode=created
          else
            echo "multiple releases found for $RELEASE_TAG" >&2
            exit 1
          fi

          assets_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")
          asset_count=$(printf '%s' "$assets_json" | jq 'length')
          if [[ "$asset_count" == 0 ]]; then
            upload_url=$(printf '%s' "$release_json" | jq -r '.upload_url')
            test -n "$upload_url" && test "$upload_url" != "null"
            upload_url="${upload_url%%\{*}"
            upload_json=$(curl --fail --silent --show-error --location \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/octet-stream' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --data-binary "@$asset" \
              "$upload_url?name=$asset_name")
            jq -e --arg name "$asset_name" '.name == $name and .state == "uploaded"' <<<"$upload_json" >/dev/null
          elif [[ "$asset_count" != 1 ]]; then
            echo "refusing to mutate release $RELEASE_TAG with $asset_count existing assets" >&2
            exit 1
          fi
          assets_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")
          jq -e --arg name "$asset_name" 'length == 1 and .[0].name == $name and .[0].state == "uploaded"' <<<"$assets_json" >/dev/null
          asset_id=$(printf '%s' "$assets_json" | jq -r '.[0].id')
          server_digest=$(printf '%s' "$assets_json" | jq -r '.[0].digest // empty')
          if [[ -n "$server_digest" ]]; then
            test "$digest" = "$server_digest"
          fi
          printf 'release_id=%s\nasset_id=%s\nasset_name=%s\ndigest=%s\ncommit=%s\ntag_mode=%s\nrelease_mode=%s\n' "$release_id" "$asset_id" "$asset_name" "$digest" "$GITHUB_SHA" "$tag_mode" "$release_mode" > "$RUNNER_TEMP/release-asset.txt"

      - name: Verify draft tag and asset digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          set -Eeuo pipefail
          release_json="$RUNNER_TEMP/release.json"
          release_id=$(grep '^release_id=' "$RUNNER_TEMP/release-asset.txt" | cut -d= -f2-)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag and .draft == true and (.assets | length == 1)
          ' "$release_json" >/dev/null
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          tag_object=$(printf '%s' "$tag_ref" | jq -r '.object.sha')
          tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")
          expected_commit=$(grep '^commit=' "$RUNNER_TEMP/release-asset.txt" | cut -d= -f2-)
          jq -e --arg sha "$expected_commit" '.object.sha == $sha and .object.type == "commit"' <<<"$tag_json" >/dev/null
          asset_id=$(grep '^asset_id=' "$RUNNER_TEMP/release-asset.txt" | cut -d= -f2-)
          asset=$(grep '^asset_name=' "$RUNNER_TEMP/release-asset.txt" | cut -d= -f2-)
          expected=$(grep '^digest=' "$RUNNER_TEMP/release-asset.txt" | cut -d= -f2-)
          jq -e --arg name "$asset" --argjson id "$asset_id" '.assets[0].name == $name and .assets[0].id == $id' "$release_json" >/dev/null
          server_digest=$(jq -r '.assets[0].digest // empty' "$release_json")
          if [[ -n "$server_digest" ]]; then
            test "$server_digest" = "$expected"
          fi
          gh api --header 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/downloaded-evidence.tar.gz"
          downloaded="sha256:$(sha256sum "$RUNNER_TEMP/downloaded-evidence.tar.gz" | cut -d' ' -f1)"
          test "$downloaded" = "$expected"
          jq -n --arg tag "$RELEASE_TAG" --arg commit "$expected_commit" --arg asset "$asset" --arg expected "$expected" --arg downloaded "$downloaded" --argjson release_id "$release_id" --argjson asset_id "$asset_id" '{tag:$tag, release_id:$release_id, commit_sha:$commit, asset:$asset, asset_id:$asset_id, expected_digest:$expected, downloaded_digest:$downloaded, draft_verified:true}' > "$RUNNER_TEMP/gooo-incremental-conformance-planner-main/release-verification.json"

      - name: Publish verified draft without rewriting it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          set -Eeuo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
          published_json="$RUNNER_TEMP/published-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$published_json"
          jq -e '.draft == false and .immutable == true' "$published_json" >/dev/null
          platform_immutable=$(jq -r '.immutable' "$published_json")
          jq --argjson platform_immutable "$platform_immutable" '. + {published:true, draft:false, platform_immutable:$platform_immutable}' "$RUNNER_TEMP/gooo-incremental-conformance-planner-main/release-verification.json" > "$RUNNER_TEMP/release-verification-published.json"
          mv "$RUNNER_TEMP/release-verification-published.json" "$RUNNER_TEMP/gooo-incremental-conformance-planner-main/release-verification.json"

      - name: Upload main evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-incremental-conformance-planner-main-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo-incremental-conformance-planner-main
          if-no-files-found: warn
          retention-days: 90
